name: Preserve immutable DSH source provenance once

on:
  push:
    branches: [upgrade/archify-v3.0.1-20261011]
    paths: ['.github/workflows/pin-dsh-source-once.yml']

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pin verified historical source to a durable mirror tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = QuJindai/Aarchify
          test "$GITHUB_REF" = refs/heads/upgrade/archify-v3.0.1-20261011
          SHA=920543baa1c6137803c5b45a69d8977152773d35
          TAG=mirror-v2-dsh-source-920543b
          # This release metadata comes from the existing v3 adapter manifest;
          # don't trust a live branch or allow a tag to drift to a different SHA.
          test "$(node -p 'require("./integrations/deepseek-harness/release.json").sourceCommit')" = "$SHA"
          git fetch --no-tags https://github.com/tt-a1i/archify.git \
            "+$SHA:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          test "$(git cat-file -t "$SHA")" = commit
          git ls-tree -r --name-only "$SHA" | grep -Fx archify/SKILL.md
          git ls-tree -r --name-only "$SHA" | grep -Fx archify/package.json
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [[ -n "$remote_tag" && "$remote_tag" != "$SHA" ]]; then
            echo "Existing tag differs; refuse to overwrite" >&2
            exit 1
          fi
          if [[ -z "$remote_tag" ]]; then
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          echo "Permanent mirror DSH source tag $TAG: $SHA"
